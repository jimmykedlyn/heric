version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    groups:
      patch-updates:
        applies-to: version-updates
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
